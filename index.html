<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>준호의 로손 토미카 3D 주차장</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background: #e2dacb;
      touch-action: none;
    }
    #canvas-container { position: absolute; inset: 0; width: 100%; height: 100%; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 28px rgba(30, 41, 59, 0.14);
    }
    .car-dock-scroll { scrollbar-width: none; -ms-overflow-style: none; }
    .car-dock-scroll::-webkit-scrollbar { display: none; }
    .car-card {
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .car-card:active { transform: scale(0.94); }
    .car-card.selected {
      transform: translateY(-6px) scale(1.05);
      border-color: #0284c7;
      box-shadow: 0 10px 22px rgba(2, 132, 199, 0.35);
      background: #f0f9ff;
    }

    /* 3D Hotspot Pulsing Circular Buttons */
    #hotspot-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      overflow: hidden;
    }
    .hotspot-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      width: 40px;
      height: 40px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.92);
      border: 2.5px solid #0284c7;
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    }
    .hotspot-btn::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 9999px;
      border: 2px solid rgba(14, 165, 233, 0.75);
      animation: hotspotPulse 1.6s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    .hotspot-btn.is-open {
      background: #0284c7;
      color: #ffffff;
      border-color: #ffffff;
    }
    .hotspot-btn:active {
      transform: translate(-50%, -50%) scale(0.9);
    }
    .hotspot-label {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.82);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      pointer-events: none;
    }
    @keyframes hotspotPulse {
      0% { transform: scale(0.92); opacity: 0.9; }
      70% { transform: scale(1.45); opacity: 0; }
      100% { transform: scale(1.45); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="hotspot-layer" class="hidden"></div>

  <!-- Top HUD -->
  <header id="top-hud" class="fixed top-3 left-3 right-3 z-20 flex items-center justify-between gap-2 pointer-events-none transition-opacity duration-200">
    <div class="glass-panel rounded-2xl px-3.5 py-2 flex items-center gap-2.5 pointer-events-auto">
      <div class="w-9 h-9 rounded-xl bg-sky-700 text-white flex items-center justify-center font-black text-sm shadow-sm">L</div>
      <div>
        <h1 class="text-sm sm:text-base font-black text-slate-800 leading-tight">준호의 로손 토미카 주차장</h1>
        <p class="text-[11px] sm:text-xs font-bold text-slate-500">
          주차 <span id="parked-count" class="text-sky-600">0</span> / <span id="total-stalls">11</span>대
        </p>
      </div>
    </div>

    <div class="flex items-center gap-1.5 pointer-events-auto">
      <button id="btn-cam-iso" type="button" class="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-slate-700 hover:bg-white active:scale-95 transition">전체</button>
      <button id="btn-cam-top" type="button" class="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-slate-700 hover:bg-white active:scale-95 transition">위에서</button>
      <button id="btn-cam-low" type="button" class="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-slate-700 hover:bg-white active:scale-95 transition">가까이</button>
      <button id="btn-sound" type="button" aria-label="소리 켜기/끄기" class="glass-panel rounded-xl w-9 h-9 flex items-center justify-center text-base hover:bg-white active:scale-95 transition">🔊</button>
      <button id="btn-clear-all" type="button" class="glass-panel rounded-xl px-2.5 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 active:scale-95 transition">모두 출차</button>
    </div>
  </header>

  <!-- Floating Guide Banner -->
  <div id="guide-banner" class="fixed top-20 left-1/2 -translate-x-1/2 z-20 pointer-events-none transition-all duration-200">
    <div id="guide-pill" class="glass-panel rounded-full px-4 py-1.5 text-xs sm:text-sm font-extrabold text-slate-700 whitespace-nowrap flex items-center gap-2">
      <span id="guide-icon">🚗</span>
      <span id="guide-text">아래에서 차를 고르거나 주차된 차를 터치하세요!</span>
    </div>
  </div>

  <!-- Bottom Waiting Car Dock -->
  <section id="dock-section" class="fixed bottom-3 left-3 right-3 z-20 pointer-events-none flex flex-col items-center transition-all duration-200">
    <div class="glass-panel rounded-3xl p-2.5 sm:p-3 w-full max-w-4xl pointer-events-auto">
      <div class="flex items-center justify-between px-1.5 mb-2 gap-2 flex-wrap">
        <div class="flex items-center gap-2">
          <span class="text-xs sm:text-sm font-black text-slate-800">대기 차고</span>
          <span id="waiting-count" class="text-[11px] font-bold bg-slate-200/80 text-slate-700 px-2 py-0.5 rounded-full">0대</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="btn-auto-park" type="button" class="hidden bg-sky-600 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-sm active:scale-95 transition">
            빈자리에 바로 주차!
          </button>
          <label for="glb-file-input" class="cursor-pointer bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-sm active:scale-95 transition">
            + .glb 불러오기
          </label>
          <input id="glb-file-input" type="file" accept=".glb,.gltf" class="hidden" />
          <button id="btn-open-add" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold px-3 py-1 rounded-full shadow-sm active:scale-95 transition">
            + 새 차 추가
          </button>
        </div>
      </div>

      <div id="waiting-dock" class="car-dock-scroll flex items-center gap-2.5 overflow-x-auto pb-1 px-1 min-h-[76px]"></div>
    </div>
  </section>

  <!-- Car Inspect Mode Overlay -->
  <section id="inspect-bar" class="fixed bottom-3 left-3 right-3 z-30 pointer-events-none hidden flex-col items-center gap-2">
    <div class="glass-panel rounded-2xl px-4 py-2.5 flex items-center justify-between gap-3 pointer-events-auto max-w-xl w-full">
      <div class="flex items-center gap-2.5">
        <span class="text-xl">✨</span>
        <div>
          <h2 id="inspect-title" class="text-sm sm:text-base font-black text-slate-800">자동차 살펴보기</h2>
          <p id="inspect-subtitle" class="text-[11px] font-bold text-slate-500">차량 위의 동그란 버튼을 터치해 열어보세요!</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-seat-toggle" type="button" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-black px-3 py-2 rounded-xl shadow-sm active:scale-95 transition">
          🪑 좌석 앉기
        </button>
        <button id="btn-inspect-exit" type="button" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-black px-3 py-2 rounded-xl shadow-sm active:scale-95 transition">
          🚗 출차
        </button>
        <button id="btn-inspect-back" type="button" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-black px-3 py-2 rounded-xl shadow-sm active:scale-95 transition">
          ← 주차장
        </button>
      </div>
    </div>
  </section>

  <!-- Add New Tomica Car Modal -->
  <div id="add-modal" class="fixed inset-0 z-40 bg-slate-900/45 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl w-full max-w-md p-5 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-black text-slate-800">새 토미카 자동차 추가하기</h2>
        <button id="btn-close-add" type="button" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold hover:bg-slate-200">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label for="new-car-name" class="block text-xs font-bold text-slate-600 mb-1">자동차 이름</label>
          <input id="new-car-name" type="text" maxlength="16" placeholder="예: 파란 경찰차, 빨간 소방차" class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>

        <div>
          <span class="block text-xs font-bold text-slate-600 mb-1.5">차량 모양</span>
          <div id="type-picker" class="grid grid-cols-3 gap-2">
            <button type="button" data-type="supercar" class="type-opt border-2 border-sky-500 bg-sky-50 rounded-xl py-2 text-xs font-bold text-slate-800">🏎️ 슈퍼카</button>
            <button type="button" data-type="sedan" class="type-opt border-2 border-slate-200 rounded-xl py-2 text-xs font-bold text-slate-700">🚗 세단</button>
            <button type="button" data-type="minivan" class="type-opt border-2 border-slate-200 rounded-xl py-2 text-xs font-bold text-slate-700">🚐 미니밴</button>
            <button type="button" data-type="suv" class="type-opt border-2 border-slate-200 rounded-xl py-2 text-xs font-bold text-slate-700">🚙 지프/SUV</button>
            <button type="button" data-type="pickup" class="type-opt border-2 border-slate-200 rounded-xl py-2 text-xs font-bold text-slate-700">🛻 픽업트럭</button>
            <button type="button" data-type="truck" class="type-opt border-2 border-slate-200 rounded-xl py-2 text-xs font-bold text-slate-700">🚚 배송트럭</button>
          </div>
        </div>

        <div>
          <span class="block text-xs font-bold text-slate-600 mb-1.5">자동차 색깔</span>
          <div id="color-picker" class="flex flex-wrap gap-2.5">
            <button type="button" data-color="#ef4444" class="color-opt w-9 h-9 rounded-full border-4 border-slate-800 shadow-sm" style="background:#ef4444"></button>
            <button type="button" data-color="#2563eb" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#2563eb"></button>
            <button type="button" data-color="#f97316" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#f97316"></button>
            <button type="button" data-color="#facc15" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#facc15"></button>
            <button type="button" data-color="#10b981" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#10b981"></button>
            <button type="button" data-color="#f8fafc" class="color-opt w-9 h-9 rounded-full border-2 border-slate-300 shadow-sm" style="background:#f8fafc"></button>
            <button type="button" data-color="#1e293b" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#1e293b"></button>
            <button type="button" data-color="#a855f7" class="color-opt w-9 h-9 rounded-full border-2 border-slate-200 shadow-sm" style="background:#a855f7"></button>
          </div>
        </div>

        <button id="btn-confirm-add" type="button" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-black py-3 rounded-2xl shadow-md active:scale-98 transition">
          차고에 추가하기!
        </button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. 모듈형 토미카 자동차 목록 & IndexedDB 영구 저장소
    // =========================================================================
    const BASE_CAR_CATALOG = [
      { id: 'supercar-orange', name: '주황 슈퍼카',   bodyType: 'supercar', color: '#f97316', roofColor: '#18181b', spoiler: true, initialStall: null },
      { id: 'taxi-white',      name: '하얀 택시',     bodyType: 'sedan',    color: '#f8fafc', roofColor: '#f8fafc', stripeColor: '#1d4ed8', taxiSign: '#facc15', initialStall: null },
      { id: 'mpv-beige',       name: '베이지 미니밴', bodyType: 'minivan',  color: '#9b9176', roofColor: '#9b9176', initialStall: null },
      { id: 'classic-red',     name: '빨간 스포츠카', bodyType: 'classic',  color: '#dc2626', roofColor: '#dc2626', initialStall: null },
      { id: 'pickup-black',    name: '검정 픽업트럭', bodyType: 'pickup',   color: '#18181b', roofColor: '#18181b', initialStall: null },
      { id: 'truck-white',     name: '편의점 트럭',   bodyType: 'truck',    color: '#f8fafc', roofColor: '#ffffff', stripeColor: '#16a34a', initialStall: null },
      { id: 'zoo-orange',      name: '동물원 지프',   bodyType: 'suv',      color: '#f59e0b', roofColor: '#f59e0b', zooRoof: true, initialStall: null },
      { id: 'sedan-gunmetal',  name: '그레이 세단',   bodyType: 'sedan',    color: '#475569', roofColor: '#1e293b', initialStall: null },
      { id: 'coupe-yellow',    name: '노랑 스포츠카', bodyType: 'supercar', color: '#eab308', roofColor: '#111827', spoiler: false, initialStall: null },
      { id: 'viptaxi-black',   name: '검정 대형택시', bodyType: 'minivan',  color: '#111827', roofColor: '#111827', taxiSign: '#f8fafc', initialStall: null },
      { id: 'van-black',       name: '검정 승합차',   bodyType: 'van',      color: '#18181b', roofColor: '#18181b', initialStall: null }
    ];

    const STORAGE_KEY = 'junho_tomica_custom_cars_v1';

    // 안티그래비티 / NAS 배포용 사전 탑재 GLB 목록 (models/ 폴더에 파일 추가 후 여기에 등록!)
    const PRELOADED_GLB_CARS = [
      { id: 'byd-sealion-7',        name: 'BYD 씨라이언 7',    url: './models/byd_sealion_7_ultra_2026.glb',                    initialStall: 0, color: '#3b82f6' },
      { id: 'hyundai-elantra-n',    name: '현대 아반떼 N',     url: './models/2024_hyundai_elantra_n.glb',                      initialStall: 1, color: '#38bdf8' },
      { id: 'lamborghini-countach', name: '람보르기니 쿤타치', url: './models/2022_lamborghini_countach_lpi_800-4.glb',        initialStall: 2, color: '#f8fafc' },
      { id: 'byd-seal',             name: 'BYD 씰',           url: './models/2024_byd_seal.glb',                               initialStall: 3, color: '#64748b' },
      { id: 'porsche-911-gt3',      name: '포르쉐 911 GT3',    url: './models/porsche_911_gt3.glb',                             initialStall: 4, color: '#dc2626' },
      { id: 'audi-rs4-avant',       name: '아우디 RS4 아반트', url: './models/2013_audi_rs4_avant.glb',                         initialStall: 5, color: '#ef4444' },
      { id: 'hyundai-ioniq-5-n',    name: '현대 아이오닉 5 N', url: './models/2024_hyundai_ioniq_5_n.glb',                      initialStall: 6, color: '#60a5fa' },
      { id: 'vw-id4-x',             name: '폭스바겐 ID.4 X',   url: './models/2021_volkswagen_id.4_x.glb',                      initialStall: 7, color: '#e2e8f0' },
      { id: 'mercedes-g63-amg',     name: '벤츠 G63 AMG',      url: './models/2015_mercedes-benz_g-class_g_63_amg.glb',         initialStall: 8, color: '#1e293b' },
      { id: 'bmw-m4-g82',           name: 'BMW M4 G82',        url: './models/2021_bmw_m4_g82_zacoe_carbon_fiber_body_kit.glb', initialStall: 9, color: '#10b981' }
    ];
    const IDB_NAME = 'junho_tomica_glb_db';
    const IDB_STORE = 'models';

    function openGlbDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) return reject(new Error('IndexedDB not supported'));
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveGlbToDB(record) {
      try {
        const db = await openGlbDB();
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(record);
      } catch (e) {}
    }

    async function loadAllGlbsFromDB() {
      try {
        const db = await openGlbDB();
        return await new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) { return []; }
    }

    const STALL_DEFS = [
      { id: 0, row: 'top',    x: -6.0, z: -1.75, rotY: Math.PI },
      { id: 1, row: 'top',    x: -3.8, z: -1.75, rotY: Math.PI },
      { id: 2, row: 'top',    x: -1.6, z: -1.75, rotY: Math.PI },
      { id: 3, row: 'top',    x:  0.6, z: -1.75, rotY: Math.PI },
      { id: 4, row: 'top',    x:  5.0, z: -1.75, rotY: Math.PI },
      { id: 5, row: 'bottom', x: -6.0, z:  3.35, rotY: 0 },
      { id: 6, row: 'bottom', x: -3.8, z:  3.35, rotY: 0 },
      { id: 7, row: 'bottom', x: -1.6, z:  3.35, rotY: 0 },
      { id: 8, row: 'bottom', x:  0.6, z:  3.35, rotY: 0 },
      { id: 9, row: 'bottom', x:  2.8, z:  3.35, rotY: 0 },
      { id: 10, row: 'bottom', x: 5.0, z:  3.35, rotY: 0 }
    ];

    // =========================================================================
    // 2. Web Audio API 합성 사운드
    // =========================================================================
    let audioCtx = null;
    let soundEnabled = true;

    function ensureAudio() {
      if (!soundEnabled) return null;
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return audioCtx;
    }

    function playHorn() {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      [0, 0.14].forEach((offset) => {
        const osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator(), gain = ctx.createGain();
        osc1.type = 'triangle'; osc2.type = 'sawtooth';
        osc1.frequency.setValueAtTime(440, now + offset);
        osc2.frequency.setValueAtTime(554.37, now + offset);
        gain.gain.setValueAtTime(0.001, now + offset);
        gain.gain.exponentialRampToValueAtTime(0.11, now + offset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.11);
        osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
        osc1.start(now + offset); osc2.start(now + offset);
        osc1.stop(now + offset + 0.12); osc2.stop(now + offset + 0.12);
      });
    }

    function playParkChime() {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.075);
        gain.gain.setValueAtTime(0.001, now + idx * 0.075);
        gain.gain.exponentialRampToValueAtTime(0.14, now + idx * 0.075 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.22);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + idx * 0.075); osc.stop(now + idx * 0.075 + 0.24);
      });
    }

    function playSelectTap() {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(620, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.06);
      gain.gain.setValueAtTime(0.09, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.09);
    }

    function playDoorWhoosh() {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(420, now + 0.14);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.19);
    }

    function playEngineHum(duration = 0.55) {
      const ctx = ensureAudio(); if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator(), gain = ctx.createGain(), filter = ctx.createBiquadFilter();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(75, now);
      osc.frequency.linearRampToValueAtTime(115, now + duration * 0.45);
      osc.frequency.linearRampToValueAtTime(82, now + duration);
      filter.type = 'lowpass'; filter.frequency.setValueAtTime(240, now);
      gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.055, now + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + duration + 0.02);
    }

    function createAsphaltTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 768;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#36393f'; ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 65000; i++) {
        const x = Math.random() * canvas.width, y = Math.random() * canvas.height;
        const v = 38 + Math.floor(Math.random() * 44);
        ctx.fillStyle = `rgb(${v},${v + 1},${v + 3})`;
        ctx.fillRect(x, y, 1.8, 1.8);
      }

      const laneGrad = ctx.createLinearGradient(0, 310, 0, 440);
      laneGrad.addColorStop(0, 'rgba(20,22,25,0)');
      laneGrad.addColorStop(0.5, 'rgba(20,22,25,0.22)');
      laneGrad.addColorStop(1, 'rgba(20,22,25,0)');
      ctx.fillStyle = laneGrad; ctx.fillRect(0, 310, canvas.width, 130);

      const brickY = canvas.height - 26;
      ctx.fillStyle = '#7c2d23'; ctx.fillRect(0, brickY, canvas.width, 26);
      for (let bx = 0; bx < canvas.width; bx += 28) {
        ctx.fillStyle = (Math.floor(bx / 28) % 2 === 0) ? '#9a3b2e' : '#853025';
        ctx.fillRect(bx + 1, brickY + 2, 25, 10);
        ctx.fillRect(bx - 12, brickY + 14, 25, 10);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8; tex.encoding = THREE.sRGBEncoding;
      return tex;
    }

    function buildTomicaCar(spec) {

      const rearGlass = new THREE.Mesh(new THREE.PlaneGeometry(bodyW * 0.84, cabinH * 1.1), glassMat);
      rearGlass.position.set(0, beltY + cabinH / 2, 0.58); rearGlass.rotation.x = 0.45;
      car.add(windshield, rearGlass);

      // Interior Seats + Steering Wheel
      const interior = new THREE.Group();
      const seatGeo = new THREE.BoxGeometry(0.24, 0.08, 0.24);
      const backGeo = new THREE.BoxGeometry(0.24, 0.24, 0.07);
      [[-0.2, -0.02], [0.2, -0.02], [-0.2, 0.34], [0.2, 0.34]].forEach(([sx, sz]) => {
        const cushion = new THREE.Mesh(seatGeo, seatMat); cushion.position.set(sx, 0.26, sz);
        const backrest = new THREE.Mesh(backGeo, seatMat); backrest.position.set(sx, 0.38, sz + 0.1); backrest.rotation.x = -0.15;
        interior.add(cushion, backrest);
      });
      const dash = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.84, 0.14, 0.18), darkTrimMat);
      dash.position.set(0, 0.36, -0.34);
      const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.016, 8, 16), darkTrimMat);
      wheel.position.set(-0.2, 0.44, -0.23); wheel.rotation.x = 0.38;
      interior.add(dash, wheel);
      car.add(interior);

      // Frunk & Trunk bays + Hinged Lids
      const frunkBay = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.66, 0.08, 0.42), darkTrimMat);
      frunkBay.position.set(0, 0.26, -0.68);
      const trunkBay = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.68, 0.08, 0.34), darkTrimMat);
      trunkBay.position.set(0, 0.28, 0.72);
      car.add(frunkBay, trunkBay);

      const hoodPivot = new THREE.Group();
      hoodPivot.position.set(0, beltY - 0.04, -0.44);
      const hoodMesh = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.82, 0.04, 0.5), paintMat);
      hoodMesh.position.set(0, 0, -0.25); hoodMesh.castShadow = true;
      hoodPivot.add(hoodMesh);
      car.add(hoodPivot);

      const trunkPivot = new THREE.Group();
      trunkPivot.position.set(0, beltY - 0.02, 0.56);
      const trunkMesh = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.82, 0.04, 0.4), paintMat);
      trunkMesh.position.set(0, 0, 0.2); trunkMesh.castShadow = true;
      trunkPivot.add(trunkMesh);
      car.add(trunkPivot);

      // Left & Right Doors with handles
      const leftDoorPivot = new THREE.Group();
      leftDoorPivot.position.set(-bodyW / 2 + 0.02, 0.33, -0.32);
      const doorPanelGeo = new THREE.BoxGeometry(0.055, 0.21, 0.64);
      const leftDoorMesh = new THREE.Mesh(doorPanelGeo, paintMat);
      leftDoorMesh.position.set(0, 0, 0.32); leftDoorMesh.castShadow = true;
      const leftMirror = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.07), paintMat);
      leftMirror.position.set(-0.05, 0.11, 0.06);
      const leftHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.09), chromeMat);
      leftHandle.position.set(-0.03, 0.05, 0.44);
      leftDoorPivot.add(leftDoorMesh, leftMirror, leftHandle);
      car.add(leftDoorPivot);

      const rightDoorPivot = new THREE.Group();
      rightDoorPivot.position.set(bodyW / 2 - 0.02, 0.33, -0.32);
      const rightDoorMesh = new THREE.Mesh(doorPanelGeo, paintMat);
      rightDoorMesh.position.set(0, 0, 0.32); rightDoorMesh.castShadow = true;
      const rightMirror = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.05, 0.07), paintMat);
      rightMirror.position.set(0.05, 0.11, 0.06);
      const rightHandle = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.09), chromeMat);
      rightHandle.position.set(0.03, 0.05, 0.44);
      rightDoorPivot.add(rightDoorMesh, rightMirror, rightHandle);
      car.add(rightDoorPivot);

      if (spec.spoiler) {
        const wing = new THREE.Mesh(new THREE.BoxGeometry(bodyW * 0.94, 0.04, 0.14), roofMat);
        wing.position.set(0, beltY + 0.12, bodyLen / 2 - 0.1);
        car.add(wing);
      }
      if (spec.taxiSign) {
        const sign = new THREE.Mesh(
          new THREE.BoxGeometry(0.24, 0.09, 0.15),
          new THREE.MeshStandardMaterial({ color: spec.taxiSign, emissive: spec.taxiSign, emissiveIntensity: 0.38 })
        );
        sign.position.set(0, roofY + 0.06, -0.25); car.add(sign);
      }
      if (spec.zooRoof) {
        const badge = new THREE.Mesh(
          new THREE.PlaneGeometry(0.55, 0.55),
          new THREE.MeshStandardMaterial({ map: createZooRoofTexture(), roughness: 0.4 })
        );
        badge.rotation.x = -Math.PI / 2; badge.position.set(0, beltY + 0.01, -0.65);
        car.add(badge);
      }
      if (bt === 'truck') {
        const cargo = new THREE.Mesh(
          new THREE.BoxGeometry(bodyW * 1.02, 0.72, 1.1),
          new THREE.MeshStandardMaterial({ color: '#f8fafc', roughness: 0.32 })
        );
        cargo.position.set(0, 0.68, 0.42); cargo.castShadow = true; car.add(cargo);
      }

      const grille = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.11, 0.03), chromeMat);
      grille.position.set(0, 0.28, -bodyLen / 2 - 0.01);
      const hlL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.04), headlightMat);
      hlL.position.set(-bodyW * 0.33, 0.32, -bodyLen / 2 - 0.01);
      const hlR = hlL.clone(); hlR.position.x = bodyW * 0.33;
      const tlL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.04), taillightMat);
      tlL.position.set(-bodyW * 0.33, 0.33, bodyLen / 2 + 0.01);
      const tlR = tlL.clone(); tlR.position.x = bodyW * 0.33;
      car.add(grille, hlL, hlR, tlL, tlR);

      const wheelGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.14, 20);
      const rimGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.15, 14);
      [
        [-bodyW * 0.47, 0.18, -bodyLen * 0.31],
        [ bodyW * 0.47, 0.18, -bodyLen * 0.31],
        [-bodyW * 0.47, 0.18,  bodyLen * 0.31],
        [ bodyW * 0.47, 0.18,  bodyLen * 0.31]
      ].forEach(([wx, wy, wz]) => {
        const tire = new THREE.Mesh(wheelGeo, tireMat);
        tire.rotation.z = Math.PI / 2; tire.position.set(wx, wy, wz); tire.castShadow = true;
        const rim = new THREE.Mesh(rimGeo, chromeMat);
        rim.rotation.z = Math.PI / 2; rim.position.set(wx, wy, wz);
        car.add(tire, rim);
      });

      car.userData = {
        type: 'car', carId: spec.id,
        bodyW, bodyLen, beltY, roofY,
        parts: {
          leftDoorPivot, rightDoorPivot,
          sunshadeMesh, sunshadeZ: 0.09,
          hoodPivot, trunkPivot,
          targetLeftDoor: 0, targetRightDoor: 0,
          targetHoodAngle: 0, targetTrunkAngle: 0, targetSunshadeZ: 0.09
        }
      };
      car.traverse((child) => {
        if (child.isMesh) { child.userData.type = 'car'; child.userData.carId = spec.id; }
      });

      return car;
    }

    function buildAllCars() {
      allCars.forEach((spec) => {
        const mesh = buildTomicaCar(spec);
        const stallIdx = (spec.initialStall !== undefined && spec.initialStall !== null) ? spec.initialStall : null;
        if (stallIdx !== null && STALL_DEFS[stallIdx]) {
          const st = STALL_DEFS[stallIdx];
          mesh.position.set(st.x, 0, st.z);
          mesh.rotation.y = st.rotY;
          mesh.visible = true;
        } else {
          mesh.visible = false;
        }
        scene.add(mesh);
        carObjects.set(spec.id, { spec, mesh, stallIndex: stallIdx, animating: false });
      });
    }

    // =========================================================================
    // 5. GLB 로더 & IndexedDB 복원
    // =========================================================================
    function getGlbNodePath(node, root) {
      const parts = [];
      let cur = node;
      while (cur && cur !== root) {
        if (cur.name) parts.push(cur.name.toLowerCase());
        cur = cur.parent;
      }
      return parts.join(' ');
    }

    function addGlbCarToScene(buffer, id, name, saveToDb, initialStall = null, color = '#3b82f6') {
      if (typeof THREE.GLTFLoader !== 'function') return;
      const loader = new THREE.GLTFLoader();
      loader.parse(buffer, '', (gltf) => {
        const root = gltf.scene;
        const box = new THREE.Box3().setFromObject(root);
        const size = new THREE.Vector3();
        box.getSize(size);

        if (size.x > size.z * 1.15) {
          root.rotation.y = Math.PI / 2;
          root.updateMatrixWorld(true);
          box.setFromObject(root);
          box.getSize(size);
        }

        const maxHoriz = Math.max(size.x, size.z) || 1;
        root.scale.multiplyScalar(2.05 / maxHoriz);
        root.updateMatrixWorld(true);

        // Auto-detect front (-Z) using front/rear glass, lights, hood/trunk, or axle names
        const preCenter = new THREE.Vector3();
        new THREE.Box3().setFromObject(root).getCenter(preCenter);
        const frontZs = [], backZs = [];
        root.traverse((c) => {
          if (!c.isMesh) return;
          const cn = getGlbNodePath(c, root);
          const isFrontCue = cn.includes('front_glass') || cn.includes('f_gls') || cn.includes('bumper_front') ||
            cn.includes('hood1a') || cn.includes('engine') ||
            (!cn.includes('combined') && (cn.includes('front l') || cn.includes('front r') || cn.includes('_lf_') || cn.includes('_rf_')));
          const isBackCue = cn.includes('back_glass') || cn.includes('b_gls') || cn.includes('tail_light') ||
            cn.includes('red_glass') || cn.includes('bumper_back') || cn.includes('trunk') || cn.includes('wing1b') ||
            cn.includes('licenseplate') ||
            (!cn.includes('combined') && (cn.includes('rear l') || cn.includes('rear r') || cn.includes('_lr_') || cn.includes('_rr_')));
          if (isFrontCue) {
            const b = new THREE.Box3().setFromObject(c);
            frontZs.push((b.min.z + b.max.z) / 2);
          } else if (isBackCue) {
            const b = new THREE.Box3().setFromObject(c);
            backZs.push((b.min.z + b.max.z) / 2);
          }
        });
        const avgFrontZ = frontZs.length ? frontZs.reduce((a, b) => a + b, 0) / frontZs.length : null;
        const avgBackZ = backZs.length ? backZs.reduce((a, b) => a + b, 0) / backZs.length : null;
        if ((avgFrontZ !== null && avgBackZ !== null && avgFrontZ > avgBackZ) ||
            (avgBackZ !== null && avgFrontZ === null && avgBackZ < preCenter.z) ||
            (avgFrontZ !== null && avgBackZ === null && avgFrontZ > preCenter.z)) {
          root.rotation.y += Math.PI;
          root.updateMatrixWorld(true);
        }

        const scaledBox = new THREE.Box3().setFromObject(root);
        const scaledCenter = new THREE.Vector3();
        scaledBox.getCenter(scaledCenter);
        const scaledSize = new THREE.Vector3();
        scaledBox.getSize(scaledSize);

        root.position.x -= scaledCenter.x;
        root.position.z -= scaledCenter.z;
        root.position.y -= scaledBox.min.y;
        root.updateMatrixWorld(true);

        const wrapper = new THREE.Group();
        const bodyFixedGroup = new THREE.Group();
        const leftDoorPivot = new THREE.Group();
        leftDoorPivot.position.set(-scaledSize.x * 0.46, scaledSize.y * 0.45, -scaledSize.z * 0.17);
        const rightDoorPivot = new THREE.Group();
        rightDoorPivot.position.set(scaledSize.x * 0.46, scaledSize.y * 0.45, -scaledSize.z * 0.17);
        const hoodPivot = new THREE.Group();
        hoodPivot.position.set(0, scaledSize.y * 0.54, -scaledSize.z * 0.22);
        const trunkPivot = new THREE.Group();
        trunkPivot.position.set(0, scaledSize.y * 0.78, scaledSize.z * 0.30);
        const sunshadeMesh = new THREE.Group();

        wrapper.add(bodyFixedGroup, leftDoorPivot, rightDoorPivot, hoodPivot, trunkPivot, sunshadeMesh);

        // Spatially split outer shell & glass meshes into real articulated 3D parts (with named-part priority)!
        const rootMeshes = [];
        root.traverse((c) => { if (c.isMesh) rootMeshes.push(c); });

        const hasNamedDoors = rootMeshes.some((m) => {
          const p = getGlbNodePath(m, root);
          return p.includes('lf_door') || p.includes('door_l_');
        });
        const hasNamedTrunk = rootMeshes.some((m) => getGlbNodePath(m, root).includes('trunk'));
        const hasNamedHood = rootMeshes.some((m) => {
          const p = getGlbNodePath(m, root);
          return p.includes('hood1a') || p.includes('car_body_hood');
        });

        function tuneGlbMaterial(mat, n) {
          if (!mat) return false;
          const mats = Array.isArray(mat) ? mat : [mat];
          let isGlassMat = n.includes('glass') || n.includes('gls') || n.includes('window');
          const isRedGlass = n.includes('red_glass') || n.includes('tail_light') || n.includes('tilllight');
          mats.forEach((m) => {
            if (!m) return;
            const mn = (m.name || '').toLowerCase();
            if (mn.includes('glass') || mn.includes('gls') || mn.includes('window')) isGlassMat = true;
            if (isGlassMat && m.transparent && !isRedGlass) {
              m.opacity = Math.min(m.opacity || 0.3, 0.28);
              m.depthWrite = false;
            }
            if (n.includes('interior') || n.includes('seat')) {
              m.side = THREE.DoubleSide;
            }
          });
          return isGlassMat || mats.some((m) => m && m.transparent);
        }

        function attachSubMesh(geom, mat, matrixWorld, tg, isTransparent) {
          const subMesh = new THREE.Mesh(geom, mat);
          subMesh.applyMatrix4(matrixWorld);
          if (tg !== bodyFixedGroup && tg !== sunshadeMesh) {
            subMesh.position.sub(tg.position);
          }
          subMesh.castShadow = !isTransparent;
          subMesh.receiveShadow = true;
          tg.add(subMesh);
        }

        const vA = new THREE.Vector3(), vB = new THREE.Vector3(), vC = new THREE.Vector3();
        rootMeshes.forEach((mesh) => {
          mesh.updateMatrixWorld(true);
          const n = getGlbNodePath(mesh, root);
          const isTransparent = tuneGlbMaterial(mesh.material, n);
          const isStaticPart = n.includes('interior') || n.includes('seat') || n.includes('alloy') || n.includes('wheel') || n.includes('tire') || n.includes('brake') || n.includes('caliper') || n.includes('calliper') || n.includes('rim') || n.includes('door_bl') || n.includes('door_br') || n.includes('lr_door') || n.includes('rr_door');

          if (!mesh.geometry || !mesh.geometry.attributes.position) return;

          if (n.includes('lf_door') || n.includes('door_l_')) {
            attachSubMesh(mesh.geometry, mesh.material, mesh.matrixWorld, leftDoorPivot, isTransparent);
            return;
          }
          if (n.includes('rf_door') || n.includes('door_r_')) {
            attachSubMesh(mesh.geometry, mesh.material, mesh.matrixWorld, rightDoorPivot, isTransparent);
            return;
          }
          if (n.includes('hood1a') || n.includes('car_body_hood')) {
            attachSubMesh(mesh.geometry, mesh.material, mesh.matrixWorld, hoodPivot, isTransparent);
            return;
          }
          if (n.includes('trunk')) {
            attachSubMesh(mesh.geometry, mesh.material, mesh.matrixWorld, trunkPivot, isTransparent);
            return;
          }

          if (isStaticPart) {
            attachSubMesh(mesh.geometry, mesh.material, mesh.matrixWorld, bodyFixedGroup, isTransparent);
            return;
          }

          const geom = mesh.geometry;
          const posAttr = geom.attributes.position;
          const idxAttr = geom.index;
          const triCount = idxAttr ? Math.floor(idxAttr.count / 3) : Math.floor(posAttr.count / 3);

          const buckets = { fixed: [], leftDoor: [], rightDoor: [], hood: [], trunk: [], sunshade: [] };
          const halfW = scaledSize.x * 0.5;
          const halfL = scaledSize.z * 0.5;

          for (let i = 0; i < triCount; i++) {
            const i0 = idxAttr ? idxAttr.getX(i * 3) : i * 3;
            const i1 = idxAttr ? idxAttr.getX(i * 3 + 1) : i * 3 + 1;
            const i2 = idxAttr ? idxAttr.getX(i * 3 + 2) : i * 3 + 2;
            vA.fromBufferAttribute(posAttr, i0).applyMatrix4(mesh.matrixWorld);
            vB.fromBufferAttribute(posAttr, i1).applyMatrix4(mesh.matrixWorld);
            vC.fromBufferAttribute(posAttr, i2).applyMatrix4(mesh.matrixWorld);

            const cx = (vA.x + vB.x + vC.x) / 3;
            const cy = (vA.y + vB.y + vC.y) / 3;
            const cz = (vA.z + vB.z + vC.z) / 3;

            if (!hasNamedDoors && cx < -halfW * 0.62 && cz > -halfL * 0.34 && cz < halfL * 0.36 && cy > scaledSize.y * 0.20 && cy < scaledSize.y * 0.86) {
              buckets.leftDoor.push(i0, i1, i2);
            } else if (!hasNamedDoors && cx > halfW * 0.62 && cz > -halfL * 0.34 && cz < halfL * 0.36 && cy > scaledSize.y * 0.20 && cy < scaledSize.y * 0.86) {
              buckets.rightDoor.push(i0, i1, i2);
            } else if (!hasNamedHood && Math.abs(cx) < halfW * 0.68 && cz < -halfL * 0.40 && cz > -halfL * 0.94 && cy > scaledSize.y * 0.26) {
              buckets.hood.push(i0, i1, i2);
            } else if (!hasNamedTrunk && Math.abs(cx) < halfW * 0.70 && cz > halfL * 0.54 && cz < halfL * 0.96 && cy > scaledSize.y * 0.36) {
              buckets.trunk.push(i0, i1, i2);
            } else if (Math.abs(cx) < halfW * 0.54 && cz > -halfL * 0.20 && cz < halfL * 0.38 && cy > scaledSize.y * 0.84) {
              buckets.sunshade.push(i0, i1, i2);
            } else {
              buckets.fixed.push(i0, i1, i2);
            }
          }

          const targetGroups = {
            fixed: bodyFixedGroup,
            leftDoor: leftDoorPivot,
            rightDoor: rightDoorPivot,
            hood: hoodPivot,
            trunk: trunkPivot,
            sunshade: sunshadeMesh
          };

          Object.keys(buckets).forEach((key) => {
            const arr = buckets[key];
            if (arr.length === 0) return;
            const subGeom = new THREE.BufferGeometry();
            Object.keys(geom.attributes).forEach((attrKey) => {
              subGeom.setAttribute(attrKey, geom.attributes[attrKey]);
            });
            subGeom.setIndex(arr);
            attachSubMesh(subGeom, mesh.material, mesh.matrixWorld, targetGroups[key], isTransparent);
          });
        });

        wrapper.userData = {
          type: 'car', carId: id, isGlb: true,
          bodyW: scaledSize.x, bodyLen: scaledSize.z,
          beltY: scaledSize.y * 0.56, roofY: scaledSize.y * 0.96, doorY: scaledSize.y * 0.50,
          seatPos: new THREE.Vector3(-scaledSize.x * 0.18, scaledSize.y * 0.64, scaledSize.z * 0.04),
          parts: {
            leftDoorPivot, rightDoorPivot,
            sunshadeMesh, sunshadeZ: 0,
            hoodPivot, trunkPivot,
            targetLeftDoor: 0, targetRightDoor: 0,
            targetHoodAngle: 0, targetTrunkAngle: 0, targetSunshadeZ: 0
          }
        };
        wrapper.traverse((child) => {
          if (child.isMesh) {
            child.userData.type = 'car';
            child.userData.carId = id;
          }
        });
        if (initialStall !== null && STALL_DEFS[initialStall]) {
          const st = STALL_DEFS[initialStall];
          wrapper.position.set(st.x, 0, st.z);
          wrapper.rotation.y = st.rotY;
          wrapper.visible = true;
        } else {
          wrapper.visible = false;
        }
        scene.add(wrapper);

        const spec = { id, name, bodyType: 'glb', color, initialStall };
        allCars.push(spec);
        carObjects.set(id, { spec, mesh: wrapper, stallIndex: initialStall, animating: false });

        if (saveToDb) {
          saveGlbToDB({ id, name, buffer });
          selectedCarId = id;
          playParkChime();
          setGuide('🎉', `${name} 저장 완료! 빈 주차 칸을 터치하세요!`);
        }
        refreshUI();
      }, (err) => {
        console.error(err);
        setGuide('⚠️', '3D 모델을 읽는 데 실패했어요.');
      });
    }

    async function loadPreloadedGlbUrl(cfg) {
      try {
        const res = await fetch(cfg.url);
        if (!res.ok) return;
        const buf = await res.arrayBuffer();
        addGlbCarToScene(buf, cfg.id, cfg.name, false, cfg.initialStall, cfg.color || '#3b82f6');
      } catch (e) {
        console.warn('Preloaded GLB fetch skipped:', cfg.url);
      }
    }

    async function restoreSavedGlbs() {
      if (typeof PRELOADED_GLB_CARS !== 'undefined') {
        PRELOADED_GLB_CARS.forEach((cfg) => loadPreloadedGlbUrl(cfg));
      }
      const saved = await loadAllGlbsFromDB();
      if (saved.length > 0) {
        saved.forEach((rec) => {
          if (!carObjects.has(rec.id)) addGlbCarToScene(rec.buffer, rec.id, rec.name, false, null);
        });
      }
    }

    // =========================================================================
    // 6. 주차 / 출차 / 3D 핫스팟 살펴보기(Inspect Mode)
    // =========================================================================
    function getOccupiedStalls() {
      const occ = new Set();
      carObjects.forEach((obj) => { if (obj.stallIndex !== null) occ.add(obj.stallIndex); });
      return occ;
    }

    function parkCarInStall(carId, stallId) {
      const carObj = carObjects.get(carId);
      const stall = STALL_DEFS[stallId];
      if (!carObj || !stall || carObj.animating) return;
      if (getOccupiedStalls().has(stallId)) return;

      selectedCarId = null;
      carObj.animating = true;
      carObj.stallIndex = stallId;
      const mesh = carObj.mesh;
      mesh.visible = true;

      const p0 = new THREE.Vector3(-9.2, 0, 0.8);
      const p1 = new THREE.Vector3(stall.x, 0, 0.8);
      const p2 = new THREE.Vector3(stall.x, 0, stall.z);
      mesh.position.copy(p0);
      mesh.rotation.y = -Math.PI / 2;

      playEngineHum(0.75);

      activeAnimations.push({
        type: 'park', carObj, startTime: performance.now(), duration: 950,
        p0, p1, p2, targetRot: stall.rotY,
        onDone: () => {
          carObj.animating = false;
          mesh.position.copy(p2);
          mesh.rotation.y = stall.rotY;
          playParkChime();
          setGuide('✨', `${carObj.spec.name} 주차 완료!`);
          refreshUI();
        }
      });
      refreshUI();
    }

    function exitCarFromStall(carId) {
      const carObj = carObjects.get(carId);
      if (!carObj || carObj.stallIndex === null || carObj.animating) return;

      if (inspectedCarId === carId) closeInspectMode(false);

      const stall = STALL_DEFS[carObj.stallIndex];
      carObj.animating = true;
      carObj.stallIndex = null;
      const mesh = carObj.mesh;

      playHorn();
      setTimeout(() => playEngineHum(0.65), 140);

      const p0 = new THREE.Vector3(stall.x, 0, stall.z);
      const p1 = new THREE.Vector3(stall.x, 0, 0.8);
      const p2 = new THREE.Vector3(9.8, 0, 0.8);

      activeAnimations.push({
        type: 'exit', carObj, startTime: performance.now(), duration: 900,
        p0, p1, p2, startRot: mesh.rotation.y,
        onDone: () => {
          carObj.animating = false;
          mesh.visible = false;
          setGuide('👋', `${carObj.spec.name} 출차했어요!`);
          refreshUI();
        }
      });
      refreshUI();
    }

    function clearAllCars() {
      if (inspectedCarId) closeInspectMode(true);
      let count = 0;
      carObjects.forEach((obj, id) => {
        if (obj.stallIndex !== null && !obj.animating) {
          setTimeout(() => exitCarFromStall(id), count * 140);
          count++;
        }
      });
      if (count === 0) setGuide('🅿️', '주차장이 이미 비어 있어요!');
    }

    function applyInspectParts(carObj) {
      const ud = carObj.mesh.userData;
      if (ud.parts) {
        ud.parts.targetLeftDoor = inspectState.leftDoor ? -1.18 : 0;
        ud.parts.targetRightDoor = inspectState.rightDoor ? 1.18 : 0;
        ud.parts.targetSunshadeZ = inspectState.sunshade ? ud.parts.sunshadeZ + 0.48 : ud.parts.sunshadeZ;
        ud.parts.targetHoodAngle = inspectState.hood ? 1.05 : 0;
        ud.parts.targetTrunkAngle = inspectState.trunk ? -1.15 : 0;
      } else if (ud.isGlb) {
        const hideGlass = inspectState.sunshade || inspectState.leftDoor || inspectState.rightDoor;
        if (ud.glassMeshes) {
          ud.glassMeshes.forEach((gm) => { gm.visible = !hideGlass; });
        }
        const cutaway = inspectState.leftDoor || inspectState.rightDoor || inspectState.hood || inspectState.trunk;
        if (ud.shellMeshes) {
          ud.shellMeshes.forEach((sm) => {
            sm.material.transparent = cutaway ? true : sm.userData.origTransparent;
            sm.material.opacity = cutaway ? 0.22 : sm.userData.origOpacity;
            sm.material.needsUpdate = true;
          });
        }
      }
    }

    function buildHotspotsForCar(carObj) {
      const layer = document.getElementById('hotspot-layer');
      layer.innerHTML = '';
      activeHotspots = [];

      const ud = carObj.mesh.userData;
      const bw = ud.bodyW || 0.98;
      const bl = ud.bodyLen || 2.02;
      const by = ud.beltY || 0.44;
      const ry = ud.roofY || 0.78;
      const dy = ud.doorY || 0.39;

      const defs = [
        { key: 'leftDoor',  icon: '🚪', label: '왼쪽 문',   pos: new THREE.Vector3(-bw / 2 - 0.06, dy, 0.08) },
        { key: 'rightDoor', icon: '🚪', label: '오른쪽 문', pos: new THREE.Vector3( bw / 2 + 0.06, dy, 0.08) },
        { key: 'sunshade',  icon: '☀️', label: '선쉐이드',  pos: new THREE.Vector3(0, ry + 0.06, 0.09) },
        { key: 'hood',      icon: '⚡', label: '프렁크',    pos: new THREE.Vector3(0, by + 0.04, -bl * 0.36) },
        { key: 'trunk',     icon: '🧳', label: '트렁크',    pos: new THREE.Vector3(0, by + 0.05,  bl * 0.38) }
      ];

      defs.forEach((d) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'hotspot-btn';
        btn.innerHTML = `${d.icon}<span class="hotspot-label">${d.label}</span>`;
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          playDoorWhoosh();
          inspectState[d.key] = !inspectState[d.key];
          btn.classList.toggle('is-open', inspectState[d.key]);
          applyInspectParts(carObj);
        });
        layer.appendChild(btn);
        activeHotspots.push({ key: d.key, localPos: d.pos, el: btn });
      });

      layer.classList.remove('hidden');
    }

    function updateHotspotsPosition() {
      if (!inspectedCarId || activeHotspots.length === 0) return;
      const carObj = carObjects.get(inspectedCarId);
      if (!carObj) return;

      const layer = document.getElementById('hotspot-layer');
      if (inspectState.seat) {
        layer.classList.add('hidden');
        return;
      }
      layer.classList.remove('hidden');

      const w = window.innerWidth;
      const h = window.innerHeight;
      const worldV = new THREE.Vector3();

      activeHotspots.forEach((hs) => {
        worldV.copy(hs.localPos);
        carObj.mesh.localToWorld(worldV);
        worldV.project(camera);

        if (worldV.z > 1) {
          hs.el.style.display = 'none';
        } else {
          hs.el.style.display = 'flex';
          const sx = (worldV.x * 0.5 + 0.5) * w;
          const sy = (-worldV.y * 0.5 + 0.5) * h;
          hs.el.style.left = sx + 'px';
          hs.el.style.top = sy + 'px';
        }
      });
    }

    function openInspectMode(carId) {
      const carObj = carObjects.get(carId);
      if (!carObj || carObj.stallIndex === null || carObj.animating) return;

      inspectedCarId = carId;
      inspectState = { leftDoor: false, rightDoor: false, sunshade: false, hood: false, trunk: false, seat: false };
      playSelectTap();

      dioramaGroup.visible = false;
      carObjects.forEach((obj, id) => { if (id !== carId) obj.mesh.visible = false; });
      studioGroup.position.set(carObj.mesh.position.x, 0, carObj.mesh.position.z);
      studioGroup.visible = true;
      scene.background = new THREE.Color('#eef2f6');
      scene.fog = null;
      controls.maxDistance = 6.5;

      document.getElementById('inspect-title').textContent = carObj.spec.name;
      document.getElementById('inspect-subtitle').textContent = '차량 위의 동그란 버튼을 터치하면 문·트렁크·선쉐이드가 열려요!';
      document.getElementById('btn-seat-toggle').textContent = '🪑 좌석 앉기';

      document.getElementById('top-hud').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('dock-section').classList.add('hidden');
      document.getElementById('guide-banner').classList.add('hidden');
      document.getElementById('inspect-bar').classList.remove('hidden');
      document.getElementById('inspect-bar').classList.add('flex');

      buildHotspotsForCar(carObj);
      focusCameraOnCar(carObj, false);
    }

    function closeInspectMode(resetCam = true) {
      if (!inspectedCarId) return;
      const carObj = carObjects.get(inspectedCarId);
      inspectState = { leftDoor: false, rightDoor: false, sunshade: false, hood: false, trunk: false, seat: false };
      if (carObj) applyInspectParts(carObj);
      inspectedCarId = null;

      document.getElementById('hotspot-layer').classList.add('hidden');
      document.getElementById('hotspot-layer').innerHTML = '';
      activeHotspots = [];

      dioramaGroup.visible = true;
      studioGroup.visible = false;
      carObjects.forEach((obj) => { obj.mesh.visible = (obj.stallIndex !== null); });
      scene.background = new THREE.Color('#ded6c6');
      scene.fog = new THREE.Fog('#ded6c6', 28, 56);
      controls.minDistance = 0.25;
      controls.maxDistance = 26;
      controls.maxPolarAngle = Math.PI / 2 - 0.04;

      document.getElementById('top-hud').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('dock-section').classList.remove('hidden');
      document.getElementById('guide-banner').classList.remove('hidden');
      document.getElementById('inspect-bar').classList.add('hidden');
      document.getElementById('inspect-bar').classList.remove('flex');

      if (resetCam) {
        moveCamera(new THREE.Vector3(-7.5, 11.2, 13.5), new THREE.Vector3(-0.4, 0.3, -0.3));
      }
    }

    function focusCameraOnCar(carObj, inSeat) {
      const pos = carObj.mesh.position;
      const rotY = carObj.mesh.rotation.y;
      if (inSeat) {
        controls.minDistance = 0.10;
        controls.maxPolarAngle = Math.PI * 0.78;
        const fwd = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
        const seatLocal = (carObj.mesh.userData.seatPos || new THREE.Vector3(-0.18, 0.50, 0.04)).clone();
        seatLocal.applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
        const camPos = pos.clone().add(seatLocal);
        const lookAt = camPos.clone().addScaledVector(fwd, 0.55).add(new THREE.Vector3(0, -0.04, 0));
        moveCamera(camPos, lookAt);
      } else {
        controls.minDistance = 0.25;
        controls.maxPolarAngle = Math.PI / 2 - 0.04;
        const offset = new THREE.Vector3(-1.95, 1.25, -2.15).applyAxisAngle(new THREE.Vector3(0, 1, 0), rotY);
        const camPos = pos.clone().add(offset);
        const lookAt = pos.clone().add(new THREE.Vector3(0, 0.4, 0));
        moveCamera(camPos, lookAt);
      }
    }

    // =========================================================================
    // 7. UI 렌더링 & 이벤트
    // =========================================================================
    function setGuide(icon, text) {
      document.getElementById('guide-icon').textContent = icon;
      document.getElementById('guide-text').textContent = text;
    }

    function refreshUI() {
      const occ = getOccupiedStalls();
      document.getElementById('parked-count').textContent = occ.size;
      document.getElementById('total-stalls').textContent = STALL_DEFS.length;

      stallIndicators.forEach((ind, idx) => {
        const isFree = !occ.has(idx);
        ind.userData.active = Boolean(selectedCarId && isFree);
        if (!ind.userData.active) ind.material.opacity = 0;
      });

      const dock = document.getElementById('waiting-dock');
      dock.innerHTML = '';
      const waitingList = [];
      carObjects.forEach((obj) => {
        if (obj.stallIndex === null && !obj.animating) waitingList.push(obj.spec);
      });

      document.getElementById('waiting-count').textContent = `${waitingList.length}대`;

      const autoBtn = document.getElementById('btn-auto-park');
      if (selectedCarId && occ.size < STALL_DEFS.length) autoBtn.classList.remove('hidden');
      else autoBtn.classList.add('hidden');

      if (waitingList.length === 0) {
        dock.innerHTML = '<div class="text-xs font-bold text-slate-500 px-3 py-4">모든 자동차가 주차장에 있어요! 주차된 차를 터치하면 크게 살펴보거나 출차할 수 있어요.</div>';
        return;
      }

      waitingList.forEach((spec) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `car-card shrink-0 flex flex-col items-center justify-center rounded-2xl border-2 border-slate-200 bg-white px-3 py-2 min-w-[84px] relative ${selectedCarId === spec.id ? 'selected' : ''}`;
        const badge = spec.bodyType === 'glb' ? '<span class="text-[9px] font-black bg-indigo-100 text-indigo-700 px-1 rounded ml-0.5">3D</span>' : '';
        btn.innerHTML = `
          <div class="w-11 h-6 rounded-lg shadow-inner border border-black/15 mb-1 flex items-center justify-center relative" style="background:${spec.color}">
            <div class="w-6 h-3 rounded-sm bg-slate-900/80"></div>
          </div>
          <span class="text-[11px] font-extrabold text-slate-800 whitespace-nowrap">${spec.name}${badge}</span>
        `;
        btn.addEventListener('click', () => {
          playSelectTap();
          if (selectedCarId === spec.id) {
            selectedCarId = null;
            setGuide('🚗', '아래에서 차를 고르거나 주차된 차를 터치하세요!');
          } else {
            selectedCarId = spec.id;
            setGuide('🅿️', `${spec.name} 선택! 반짝이는 빈 주차 칸을 터치하세요!`);
          }
          refreshUI();
        });
        dock.appendChild(btn);
      });
    }

    function moveCamera(pos, target) {
      const startPos = camera.position.clone();
      const startTarget = controls.target.clone();
      const start = performance.now();
      const dur = 500;
      function step(now) {
        const t = Math.min((now - start) / dur, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        camera.position.lerpVectors(startPos, pos, ease);
        controls.target.lerpVectors(startTarget, target, ease);
        controls.update();
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function bindEvents() {
      let downX = 0, downY = 0;
      const dom = renderer.domElement;
      dom.addEventListener('pointerdown', (e) => { downX = e.clientX; downY = e.clientY; });
      dom.addEventListener('pointerup', (e) => {
        const dist = Math.hypot(e.clientX - downX, e.clientY - downY);
        if (dist > 10) return;

        const rect = dom.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        if (selectedCarId && !inspectedCarId) {
          const stallHits = raycaster.intersectObjects(stallMeshes, false);
          if (stallHits.length > 0) {
            const stallId = stallHits[0].object.userData.stallId;
            if (!getOccupiedStalls().has(stallId)) {
              parkCarInStall(selectedCarId, stallId);
              return;
            }
          }
        }

        if (!inspectedCarId) {
          const visibleCars = [];
          carObjects.forEach((obj) => {
            if (obj.mesh.visible && obj.stallIndex !== null && !obj.animating) visibleCars.push(obj.mesh);
          });
          const carHits = raycaster.intersectObjects(visibleCars, true);
          if (carHits.length > 0) {
            const hitCarId = carHits[0].object.userData.carId;
            if (hitCarId) openInspectMode(hitCarId);
          }
        }
      });

      document.getElementById('btn-cam-iso').addEventListener('click', () => {
        playSelectTap(); moveCamera(new THREE.Vector3(-7.5, 11.2, 13.5), new THREE.Vector3(-0.4, 0.3, -0.3));
      });
      document.getElementById('btn-cam-top').addEventListener('click', () => {
        playSelectTap(); moveCamera(new THREE.Vector3(-0.4, 17.5, 1.8), new THREE.Vector3(-0.4, 0, -0.5));
      });
      document.getElementById('btn-cam-low').addEventListener('click', () => {
        playSelectTap(); moveCamera(new THREE.Vector3(-9.2, 4.6, 8.8), new THREE.Vector3(0.2, 0.8, -1.2));
      });

      document.getElementById('btn-sound').addEventListener('click', (e) => {
        soundEnabled = !soundEnabled;
        e.currentTarget.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) playSelectTap();
      });

      document.getElementById('btn-clear-all').addEventListener('click', () => clearAllCars());

      document.getElementById('btn-auto-park').addEventListener('click', () => {
        if (!selectedCarId) return;
        const occ = getOccupiedStalls();
        const freeStall = STALL_DEFS.find((s) => !occ.has(s.id));
        if (freeStall) parkCarInStall(selectedCarId, freeStall.id);
      });

      document.getElementById('btn-inspect-back').addEventListener('click', () => {
        playSelectTap(); closeInspectMode(true);
      });
      document.getElementById('btn-inspect-exit').addEventListener('click', () => {
        if (inspectedCarId) exitCarFromStall(inspectedCarId);
      });
      document.getElementById('btn-seat-toggle').addEventListener('click', (e) => {
        if (!inspectedCarId) return;
        playSelectTap();
        inspectState.seat = !inspectState.seat;
        e.currentTarget.textContent = inspectState.seat ? '🚶 차에서 내리기' : '🪑 좌석 앉기';
        focusCameraOnCar(carObjects.get(inspectedCarId), inspectState.seat);
      });

      document.getElementById('glb-file-input').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        setGuide('⏳', `${file.name} 불러오는 중...`);
        const reader = new FileReader();
        reader.onload = (ev) => {
          const cleanName = file.name.replace(/\.(glb|gltf)$/i, '').replace(/[_-]+/g, ' ').slice(0, 16) || '내 3D 자동차';
          addGlbCarToScene(ev.target.result, 'glb-' + Date.now(), cleanName, true);
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      });

      let newType = 'supercar';
      let newColor = '#ef4444';
      const modal = document.getElementById('add-modal');

      document.getElementById('btn-open-add').addEventListener('click', () => {
        playSelectTap(); modal.classList.remove('hidden'); modal.classList.add('flex');
      });
      document.getElementById('btn-close-add').addEventListener('click', () => {
        modal.classList.add('hidden'); modal.classList.remove('flex');
      });

      document.querySelectorAll('.type-opt').forEach((btn) => {
        btn.addEventListener('click', () => {
          newType = btn.dataset.type;
          document.querySelectorAll('.type-opt').forEach((b) => {
            b.classList.remove('border-sky-500', 'bg-sky-50'); b.classList.add('border-slate-200');
          });
          btn.classList.remove('border-slate-200'); btn.classList.add('border-sky-500', 'bg-sky-50');
        });
      });

      document.querySelectorAll('.color-opt').forEach((btn) => {
        btn.addEventListener('click', () => {
          newColor = btn.dataset.color;
          document.querySelectorAll('.color-opt').forEach((b) => {
            b.classList.remove('border-4', 'border-slate-800'); b.classList.add('border-2', 'border-slate-200');
          });
          btn.classList.remove('border-2', 'border-slate-200'); btn.classList.add('border-4', 'border-slate-800');
        });
      });

      document.getElementById('btn-confirm-add').addEventListener('click', () => {
        const input = document.getElementById('new-car-name');
        const name = input.value.trim() || '새 토미카';
        const spec = { id: 'custom-' + Date.now(), name, bodyType: newType, color: newColor, roofColor: newColor, initialStall: null };
        customCars.push(spec); allCars.push(spec); saveCustomCars();

        const mesh = buildTomicaCar(spec);
        mesh.visible = false; scene.add(mesh);
        carObjects.set(spec.id, { spec, mesh, stallIndex: null, animating: false });

        input.value = ''; modal.classList.add('hidden'); modal.classList.remove('flex');
        selectedCarId = spec.id; playParkChime();
        setGuide('🆕', `${spec.name} 추가 완료! 빈 주차 칸을 터치하세요!`);
        refreshUI();
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function lerpAngle(a, b, t) {
      let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
      if (diff < -Math.PI) diff += Math.PI * 2;
      return a + diff * t;
    }

    function animate(now = performance.now()) {
      requestAnimationFrame(animate);

      const pulse = 0.25 + 0.22 * Math.sin(now * 0.006);
      stallIndicators.forEach((ind) => {
        if (ind.userData.active) ind.material.opacity = pulse;
      });

      carObjects.forEach((obj) => {
        const p = obj.mesh.userData.parts;
        if (p) {
          p.leftDoorPivot.rotation.y += (p.targetLeftDoor - p.leftDoorPivot.rotation.y) * 0.16;
          p.rightDoorPivot.rotation.y += (p.targetRightDoor - p.rightDoorPivot.rotation.y) * 0.16;
          p.hoodPivot.rotation.x += (p.targetHoodAngle - p.hoodPivot.rotation.x) * 0.16;
          p.trunkPivot.rotation.x += (p.targetTrunkAngle - p.trunkPivot.rotation.x) * 0.16;
          p.sunshadeMesh.position.z += (p.targetSunshadeZ - p.sunshadeMesh.position.z) * 0.16;
          p.sunshadeMesh.visible = Math.abs(p.sunshadeMesh.position.z - p.sunshadeZ) < 0.36;
        }
      });

      for (let i = activeAnimations.length - 1; i >= 0; i--) {
        const anim = activeAnimations[i];
        const t = Math.min((now - anim.startTime) / anim.duration, 1);
        const mesh = anim.carObj.mesh;

        if (anim.type === 'park') {
          if (t < 0.55) {
            const st = t / 0.55;
            mesh.position.lerpVectors(anim.p0, anim.p1, 1 - Math.pow(1 - st, 2));
            mesh.rotation.y = -Math.PI / 2;
          } else {
            const st = (t - 0.55) / 0.45;
            mesh.position.lerpVectors(anim.p1, anim.p2, 1 - Math.pow(1 - st, 3));
            mesh.rotation.y = lerpAngle(-Math.PI / 2, anim.targetRot, Math.min(st * 1.4, 1));
          }
        } else if (anim.type === 'exit') {
          if (t < 0.45) {
            const st = t / 0.45;
            mesh.position.lerpVectors(anim.p0, anim.p1, st * st);
            mesh.rotation.y = lerpAngle(anim.startRot, -Math.PI / 2, st);
          } else {
            const st = (t - 0.45) / 0.55;
            mesh.position.lerpVectors(anim.p1, anim.p2, st * st);
            mesh.rotation.y = -Math.PI / 2;
          }
        }

        if (t >= 1) {
          activeAnimations.splice(i, 1);
          anim.onDone();
        }
      }

      controls.update();
      updateHotspotsPosition();
      renderer.render(scene, camera);
    }

    window.onload = () => {
      loadCustomCars();
      initScene();
      refreshUI();
    };
  </script>
